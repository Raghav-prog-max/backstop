# Lint and test on every Python the project supports (requires-python >= 3.11).

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # [serve] so the API tests run instead of skipping; [dev] brings pytest and
        # the TestClient transport.
        python -m pip install -e ".[dev,serve]" flake8
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest -q
    - name: Batch runs end to end
      run: |
        python -m backstop.runner --cases 1000 --days 7 --html why_not.html
    - name: Lift survives a world it was not tuned in
      run: |
        python -m backstop.robustness --cases 1200 --days 8 --seeds 2 --strict
